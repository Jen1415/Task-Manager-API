[project]
name = "taskmanagerapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jen1415", email = "qiwen894@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
taskmanagerapi = "taskmanagerapi:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]
